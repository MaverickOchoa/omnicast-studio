<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="512" height="512" rx="110" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="url(#neon)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Broadcast Signal Waves (Left & Right) -->
  <g fill="none" stroke="url(#neon)" stroke-width="14" stroke-linecap="round" filter="url(#shadow)">
    <!-- Inner waves -->
    <path d="M 200 170 A 75 75 0 0 0 200 270" stroke-opacity="0.95"/>
    <path d="M 312 170 A 75 75 0 0 1 312 270" stroke-opacity="0.95"/>

    <!-- Middle waves -->
    <path d="M 165 130 A 130 130 0 0 0 165 310" stroke-opacity="0.75" stroke-width="12"/>
    <path d="M 347 130 A 130 130 0 0 1 347 310" stroke-opacity="0.75" stroke-width="12"/>

    <!-- Outer waves -->
    <path d="M 130 90 A 185 185 0 0 0 130 350" stroke-opacity="0.45" stroke-width="10"/>
    <path d="M 382 90 A 185 185 0 0 1 382 350" stroke-opacity="0.45" stroke-width="10"/>
  </g>

  <!-- Central Transmitter Node -->
  <circle cx="256" cy="220" r="28" fill="url(#neon)" filter="url(#shadow)"/>
  <circle cx="256" cy="220" r="14" fill="#ffffff"/>

  <!-- Tower Mast Structure -->
  <path d="M 256 248 L 256 380" stroke="url(#neon)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 210 380 L 256 265 L 302 380" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 225 330 L 287 330" stroke="url(#neon)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 190 395 L 322 395" stroke="url(#neon)" stroke-width="14" stroke-linecap="round"/>

  <!-- OmniCast Wordmark Sub-badge -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="32" letter-spacing="6" fill="#f8fafc">OMNICAST</text>
  <text x="256" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="14" letter-spacing="4" fill="#38bdf8">STUDIO CLOUD</text>
</svg>