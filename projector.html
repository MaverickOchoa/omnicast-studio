<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniCast - Salida Proyector / Audiencia (HDMI 1080p / 4K)</title>
  <!-- PWA Manifest & Display Mode -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for ProPresenter Grade Church Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;600;800;900&family=Montserrat:wght@700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      overflow: hidden;
      user-select: none;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .slide-text-broadcast {
      text-shadow: 0 4px 35px rgba(0,0,0,0.98), 0 2px 14px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.9);
    }
    .slide-text-glow {
      text-shadow: 0 0 30px rgba(255,255,255,0.4), 0 4px 25px rgba(0,0,0,0.9);
    }
    .slide-text-none {
      text-shadow: none;
    }
    /* Smooth Transitions */
    .fade-transition {
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative overflow-hidden bg-black">

  <!-- Video Loop Background Player (When Video Loop is selected) -->
  <video id="videoLoopPlayer" autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0 hidden"></video>

  <!-- Custom Image Loop Background Player (When Image Loop is selected) -->
  <img id="customImageLoopPlayer" class="absolute inset-0 w-full h-full object-cover z-0 hidden" alt="Fondo Personalizado">

  <!-- Full-Screen Media Video Player (When an uploaded .mp4/.webm/.mov video is projected) -->
  <video id="mediaProjectorVideo" muted playsinline preload="auto" class="absolute inset-0 w-full h-full object-contain bg-black z-30 hidden"></video>

  <!-- YouTube Full-Screen Player (When a YouTube video is projected or played in Capa 4 / Media) -->
  <div id="youtubeProjectorLayer" class="absolute inset-0 w-full h-full z-25 hidden">
    <iframe id="youtubeProjectorIframe" class="w-full h-full border-0 pointer-events-none" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <!-- Procedural Canvas for Dynamic Motion Loops (GPU Animated 60fps) -->
  <canvas id="motionCanvas" class="absolute inset-0 w-full h-full object-cover z-0"></canvas>

  <!-- Ambient Dark Overlay for Readability with Adjustable Dimmer & Blur -->
  <div id="ambientOverlay" class="absolute inset-0 bg-black/40 backdrop-blur-[0px] z-10 transition-all duration-500"></div>

  <!-- Capa 1: Portada / Telón de Espera Full-Screen (z-35) -->
  <div id="projectorSlateLayer" class="absolute inset-0 w-full h-full z-35 flex items-center justify-center bg-black transition-opacity duration-500 opacity-0 pointer-events-none hidden">
    <img id="projectorSlateImg" class="absolute inset-0 w-full h-full object-cover hidden" alt="Portada">
    <div id="projectorSlateTextContainer" class="relative z-10 text-center px-8 max-w-5xl flex flex-col items-center hidden">
      <h1 id="projectorSlateTitle" class="text-white font-black text-6xl md:text-8xl tracking-wide drop-shadow-2xl"></h1>
      <p id="projectorSlateSubtitle" class="mt-4 text-sky-300 font-semibold text-2xl md:text-3xl drop-shadow-lg"></p>
      <div id="projectorSlatePill" class="mt-8 px-6 py-2 rounded-full bg-slate-900/80 border border-slate-700/80 text-emerald-400 font-bold text-lg flex items-center gap-3 shadow-2xl">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>TRANSMISIÓN EN VIVO</span>
      </div>
    </div>
  </div>

  <!-- Capa 1: Logo Bug / Marca de Agua (z-40) -->
  <div id="projectorLogoLayer" class="absolute inset-0 w-full h-full z-40 pointer-events-none hidden">
    <div id="projectorLogoBox" class="absolute top-8 right-8 transition-all duration-300">
      <img id="projectorLogoImg" class="max-w-[220px] max-h-[140px] object-contain drop-shadow-2xl" alt="Logo">
    </div>
  </div>

  <!-- Main Lyric / Scripture Wrapper (Center vs Lower Third Layout) -->
  <div id="lyricsWrapper" class="absolute inset-0 z-20 flex items-center justify-center p-6 md:p-12 transition-all duration-500">
    <div id="lyricsBox" class="w-full max-w-5xl text-center flex flex-col items-center justify-center transition-all duration-500">
      
      <!-- Section / Verse Badge -->
      <div id="referenceBadge" class="hidden mb-4 px-6 py-1.5 rounded-full bg-amber-500/25 border border-amber-400/50 text-amber-300 font-extrabold text-xl tracking-widest uppercase shadow-lg">
        VERSO 1
      </div>
      
      <!-- Main Slide Lyric Text -->
      <h1 id="mainText" class="slide-text-broadcast text-white font-black text-5xl md:text-7xl leading-tight tracking-wide fade-transition">
        OmniCast Studio
      </h1>

      <!-- Secondary Subtext / Chords / Scripture Reference -->
      <p id="subText" class="mt-4 text-slate-200 text-2xl font-medium slide-text-broadcast fade-transition">
        Esperando señal del operador de presentación...
      </p>
    </div>
  </div>

  <!-- Bottom Tally Indicator -->
  <div class="absolute bottom-4 right-6 text-xs text-white/40 font-mono tracking-widest flex items-center gap-2 z-20">
    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
    <span id="campusIndicator">SALIDA PÚBLICA HDMI 1080p</span>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const activeChurch = urlParams.get('church') || '';
    const channelName = activeChurch ? `omnicast_live_${activeChurch}` : 'omnicast_live_channel';
    const channel = new BroadcastChannel(channelName);
    const mainText = document.getElementById('mainText');
    const subText = document.getElementById('subText');
    const refBadge = document.getElementById('referenceBadge');
    const lyricsWrapper = document.getElementById('lyricsWrapper');
    const lyricsBox = document.getElementById('lyricsBox');
    const ambientOverlay = document.getElementById('ambientOverlay');
    const videoLoopPlayer = document.getElementById('videoLoopPlayer');
    const mediaProjectorVideo = document.getElementById('mediaProjectorVideo');
    const youtubeProjectorLayer = document.getElementById('youtubeProjectorLayer');
    const youtubeProjectorIframe = document.getElementById('youtubeProjectorIframe');
    const campusIndicator = document.getElementById('campusIndicator');
    const motionCanvas = document.getElementById('motionCanvas');
    const ctx = motionCanvas.getContext('2d');

    function extractYouTubeId(url) {
      if (!url) return null;
      const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/i);
      return m ? m[1] : null;
    }

    // High DPI Canvas setup
    function resizeCanvas() {
      motionCanvas.width = window.innerWidth;
      motionCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // -------------------------------------------------------------------------
    // PROCEDURAL MOTION LOOPS SHADER ENGINE (60 FPS GPU ANIMATED)
    // -------------------------------------------------------------------------
    const themesPalette = {
      purple: { 
        name: 'Celestial Worship', 
        bg1: '#070514', bg2: '#1a0d33', 
        light1: '#7c3aed', light2: '#a855f7', 
        particle: 'rgba(192, 132, 252, 0.55)',
        type: 'nebula'
      },
      gold: { 
        name: 'Shekinah Gold', 
        bg1: '#120b02', bg2: '#331a03', 
        light1: '#d97706', light2: '#f59e0b', 
        particle: 'rgba(251, 191, 36, 0.65)',
        type: 'embers'
      },
      blue: { 
        name: 'Living Waters', 
        bg1: '#020e1f', bg2: '#06263e', 
        light1: '#0284c7', light2: '#38bdf8', 
        particle: 'rgba(125, 211, 252, 0.55)',
        type: 'waves'
      },
      custom: { 
        name: 'Personalizado', 
        bg1: '#070514', bg2: '#1a0d33', 
        light1: '#38bdf8', light2: '#818cf8', 
        particle: 'rgba(56, 189, 248, 0.45)',
        type: 'nebula'
      },
      emerald: { 
        name: 'Personalizado', 
        bg1: '#070514', bg2: '#1a0d33', 
        light1: '#38bdf8', light2: '#818cf8', 
        particle: 'rgba(56, 189, 248, 0.45)',
        type: 'nebula'
      },
      crimson: { 
        name: 'Holy Fire', 
        bg1: '#170306', bg2: '#3d0413', 
        light1: '#be123c', light2: '#f43f5e', 
        particle: 'rgba(251, 113, 133, 0.6)',
        type: 'embers'
      },
      bokeh: {
        name: 'Ambient Bokeh',
        bg1: '#090910', bg2: '#151525',
        light1: '#8b5cf6', light2: '#38bdf8',
        particle: 'rgba(255, 255, 255, 0.4)',
        type: 'bokeh'
      },
      dark: { 
        name: 'Minimalist Solemn', 
        bg1: '#000000', bg2: '#080a0f', 
        light1: '#1e293b', light2: '#334155', 
        particle: 'rgba(148, 163, 184, 0.15)',
        type: 'dark'
      }
    };

    let activeTheme = 'purple';
    let currentLayoutMode = 'center'; // 'center' | 'lowerThird'
    let currentFontFamily = 'Inter';
    let isUppercase = true;
    let currentTextShadow = 'broadcast';
    let activeVideoLoop = '';

    // Particle collection for motion backgrounds
    const particles = [];
    for (let i = 0; i < 55; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 4 + 1.2,
        vx: (Math.random() - 0.5) * 0.45,
        vy: -Math.random() * 0.6 - 0.15,
        alpha: Math.random() * 0.7 + 0.3,
        pulseSpeed: Math.random() * 0.03 + 0.01,
        bokehColor: ['rgba(244, 63, 94, 0.25)', 'rgba(56, 189, 248, 0.25)', 'rgba(168, 85, 247, 0.25)', 'rgba(251, 191, 36, 0.25)'][i % 4]
      });
    }

    let animTime = 0;
    function renderMotionBackground() {
      animTime += 0.015;
      const w = motionCanvas.width;
      const h = motionCanvas.height;
      const t = themesPalette[activeTheme] || themesPalette.purple;

      // 1. Draw smooth gradient base
      const grad = ctx.createRadialGradient(
        w * 0.5 + Math.sin(animTime * 0.5) * 140,
        h * 0.5 + Math.cos(animTime * 0.4) * 90,
        60,
        w * 0.5,
        h * 0.5,
        w * 0.75
      );
      grad.addColorStop(0, t.bg2);
      grad.addColorStop(1, t.bg1);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // 2. Specialized Motion Types
      if (t.type === 'bokeh') {
        // Draw soft ambient floating bokeh discs
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        particles.forEach((p, idx) => {
          p.y += p.vy * 0.7;
          p.x += Math.sin(animTime + idx) * 0.3;
          if (p.y < -50) p.y = h + 50;
          if (p.x < -50) p.x = w + 50;
          if (p.x > w + 50) p.x = -50;

          const bokehSize = (p.radius * 9) + Math.sin(animTime * 2 + idx) * 4;
          const bGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, bokehSize);
          bGrad.addColorStop(0, p.bokehColor);
          bGrad.addColorStop(0.7, p.bokehColor.replace('0.25', '0.08'));
          bGrad.addColorStop(1, 'transparent');
          ctx.fillStyle = bGrad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, bokehSize, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      } else if (activeTheme !== 'dark') {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        
        // Volumetric Light Beam 1
        const beamGrad1 = ctx.createLinearGradient(0, 0, w, h);
        beamGrad1.addColorStop(0, 'transparent');
        beamGrad1.addColorStop(0.5, t.light1 + '30');
        beamGrad1.addColorStop(1, 'transparent');
        ctx.fillStyle = beamGrad1;
        ctx.beginPath();
        ctx.moveTo(w * 0.2 + Math.sin(animTime) * 120, 0);
        ctx.lineTo(w * 0.7 + Math.cos(animTime) * 120, h);
        ctx.lineTo(w * 0.4, h);
        ctx.closePath();
        ctx.fill();

        // Volumetric Light Beam 2
        const beamGrad2 = ctx.createLinearGradient(w, 0, 0, h);
        beamGrad2.addColorStop(0, 'transparent');
        beamGrad2.addColorStop(0.5, t.light2 + '25');
        beamGrad2.addColorStop(1, 'transparent');
        ctx.fillStyle = beamGrad2;
        ctx.beginPath();
        ctx.moveTo(w * 0.8 + Math.cos(animTime * 0.8) * 90, 0);
        ctx.lineTo(w * 0.25, h);
        ctx.lineTo(w * 0.48, h);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        // Floating ambient particles / embers
        ctx.fillStyle = t.particle;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.y < -10) p.y = h + 10;
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      requestAnimationFrame(renderMotionBackground);
    }
    requestAnimationFrame(renderMotionBackground);

    // -------------------------------------------------------------------------
    // LAYOUT MODE & DISPLAY UPDATE ENGINE
    // -------------------------------------------------------------------------
    function applyLayoutMode(mode) {
      currentLayoutMode = mode || 'center';
      if (currentLayoutMode === 'lowerThird') {
        lyricsWrapper.className = 'absolute inset-0 z-20 flex items-end justify-center p-6 md:p-10 pointer-events-none transition-all duration-500';
        lyricsBox.className = 'w-full max-w-5xl p-6 md:p-8 rounded-3xl bg-slate-950/85 backdrop-blur-xl border border-white/10 shadow-2xl text-center flex flex-col items-center justify-center transition-all duration-500';
      } else {
        lyricsWrapper.className = 'absolute inset-0 z-20 flex items-center justify-center p-6 md:p-12 transition-all duration-500';
        lyricsBox.className = 'w-full max-w-5xl text-center flex flex-col items-center justify-center transition-all duration-500';
      }
    }

    function applyTypography(data) {
      if (data.fontFamily) currentFontFamily = data.fontFamily;
      if (typeof data.isUppercase === 'boolean') isUppercase = data.isUppercase;
      if (data.textShadow) currentTextShadow = data.textShadow;

      // Font Family Mapping
      let fontStack = "'Inter', sans-serif";
      if (currentFontFamily === 'Cinzel') fontStack = "'Cinzel', serif";
      else if (currentFontFamily === 'Montserrat') fontStack = "'Montserrat', sans-serif";
      else if (currentFontFamily === 'Caveat') fontStack = "'Caveat', cursive";

      mainText.style.fontFamily = fontStack;
      subText.style.fontFamily = fontStack;
      mainText.style.textTransform = isUppercase ? 'uppercase' : 'none';

      // Text Shadow Class
      mainText.classList.remove('slide-text-broadcast', 'slide-text-glow', 'slide-text-none');
      subText.classList.remove('slide-text-broadcast', 'slide-text-glow', 'slide-text-none');
      if (currentTextShadow === 'glow') {
        mainText.classList.add('slide-text-glow');
        subText.classList.add('slide-text-glow');
      } else if (currentTextShadow === 'none') {
        mainText.classList.add('slide-text-none');
        subText.classList.add('slide-text-none');
      } else {
        mainText.classList.add('slide-text-broadcast');
        subText.classList.add('slide-text-broadcast');
      }

      // Dimmer Overlay and Blur
      if (typeof data.overlayDarkness === 'number') {
        ambientOverlay.style.backgroundColor = `rgba(0, 0, 0, ${data.overlayDarkness})`;
      }
      if (typeof data.backgroundBlur === 'number') {
        ambientOverlay.style.backdropFilter = `blur(${data.backgroundBlur}px)`;
      }

      // Custom Background Image Handler
      const customImgEl = document.getElementById('customImageLoopPlayer');
      if (data.customBgUrl) {
        if (customImgEl) {
          if (customImgEl.getAttribute('data-src') !== data.customBgUrl) {
            customImgEl.src = data.customBgUrl;
            customImgEl.setAttribute('data-src', data.customBgUrl);
          }
          customImgEl.classList.remove('hidden');
        }
      } else if (customImgEl) {
        customImgEl.classList.add('hidden');
        customImgEl.removeAttribute('src');
        customImgEl.removeAttribute('data-src');
      }

      // Video Loop Handler
      if (data.videoLoopUrl && data.videoLoopUrl !== activeVideoLoop) {
        activeVideoLoop = data.videoLoopUrl;
        videoLoopPlayer.src = activeVideoLoop;
        videoLoopPlayer.muted = true;
        videoLoopPlayer.loop = true;
        videoLoopPlayer.classList.remove('hidden');
        if (customImgEl) customImgEl.classList.add('hidden');
        const p = videoLoopPlayer.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
        videoLoopPlayer.oncanplay = () => {
          videoLoopPlayer.play().catch(() => {});
        };
      } else if (!data.videoLoopUrl && activeVideoLoop) {
        activeVideoLoop = '';
        videoLoopPlayer.pause();
        videoLoopPlayer.src = '';
        videoLoopPlayer.classList.add('hidden');
      }
    }

    // =====================================================================
    // MOTOR DE VIDEO ESCLAVO (estilo WorshipTools Presenter)
    // - Ignora mensajes viejos (el servidor reenvía copias con tiempo desfasado)
    // - Compensa la latencia con el timestamp del mensaje
    // - Solo corrige el tiempo si el desfase es mayor a 2s (sin saltos ni tirones)
    // =====================================================================
    let lastVideoMsgTs = 0;
    let desiredVideoPlaying = false;
    const keepAliveCanvas = document.createElement('canvas');
    keepAliveCanvas.width = 2;
    keepAliveCanvas.height = 2;
    const keepAliveCtx = keepAliveCanvas.getContext('2d');

    if (mediaProjectorVideo) {
      mediaProjectorVideo.addEventListener('ended', () => {
        if (mediaProjectorVideo.loop) {
          mediaProjectorVideo.currentTime = 0;
          mediaProjectorVideo.play().catch(() => {});
        } else {
          desiredVideoPlaying = false;
        }
      });
      // Evita que Chrome suspenda el video a los 2s cuando la ventana del proyector está en segundo plano
      mediaProjectorVideo.addEventListener('pause', () => {
        if (desiredVideoPlaying && !mediaProjectorVideo.ended) {
          mediaProjectorVideo.muted = true;
          mediaProjectorVideo.play().catch(() => {});
        }
      });
      try {
        const kaWorker = new Worker(URL.createObjectURL(new Blob([
          "setInterval(() => postMessage('t'), 200);"
        ], { type: 'application/javascript' })));
        kaWorker.onmessage = () => {
          if (desiredVideoPlaying && mediaProjectorVideo && (!mediaProjectorVideo.ended || mediaProjectorVideo.loop)) {
            if (mediaProjectorVideo.ended && mediaProjectorVideo.loop) {
              mediaProjectorVideo.currentTime = 0;
            }
            if (mediaProjectorVideo.readyState >= 2) {
              try { keepAliveCtx.drawImage(mediaProjectorVideo, 0, 0, 2, 2); } catch (e) {}
            }
            if (mediaProjectorVideo.paused) {
              mediaProjectorVideo.muted = true;
              mediaProjectorVideo.play().catch(() => {});
            }
          }
        };
      } catch (e) {}
    }

    function applyVideoState(st) {
      const ts = Number(st.ts) || 0;
      if (ts && ts < lastVideoMsgTs) return; // mensaje viejo: descartar
      if (ts) lastVideoMsgTs = ts;

      const ytId = extractYouTubeId(st.url);

      if (st.action === 'stop') {
        desiredVideoPlaying = false;
        if (mediaProjectorVideo) {
          mediaProjectorVideo.pause();
          mediaProjectorVideo.classList.add('hidden');
        }
        if (youtubeProjectorLayer && youtubeProjectorIframe) {
          youtubeProjectorLayer.classList.add('hidden');
          youtubeProjectorIframe.src = '';
          youtubeProjectorIframe.removeAttribute('data-active-yt');
        }
        lyricsWrapper.classList.remove('hidden');
        return;
      }

      if (ytId) {
        desiredVideoPlaying = true;
        if (mediaProjectorVideo) {
          mediaProjectorVideo.pause();
          mediaProjectorVideo.classList.add('hidden');
        }
        if (youtubeProjectorLayer && youtubeProjectorIframe) {
          youtubeProjectorLayer.classList.remove('hidden');
          if (youtubeProjectorIframe.getAttribute('data-active-yt') !== ytId) {
            youtubeProjectorIframe.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&mute=0&controls=0&loop=1&playlist=${ytId}&enablejsapi=1`;
            youtubeProjectorIframe.setAttribute('data-active-yt', ytId);
          }
        }
        lyricsWrapper.classList.add('hidden');
        return;
      }

      // Direct Video (.mp4 / .webm)
      if (youtubeProjectorLayer && youtubeProjectorIframe) {
        youtubeProjectorLayer.classList.add('hidden');
        youtubeProjectorIframe.src = '';
        youtubeProjectorIframe.removeAttribute('data-active-yt');
      }

      if (!mediaProjectorVideo) return;

      if (st.url && mediaProjectorVideo.getAttribute('data-src') !== st.url) {
        const sep = st.url.includes('?') ? '&' : '?';
        mediaProjectorVideo.src = `${st.url}${sep}screen=projector`;
        mediaProjectorVideo.setAttribute('data-src', st.url);
      }
      if (typeof st.loop === 'boolean') mediaProjectorVideo.loop = st.loop;
      mediaProjectorVideo.muted = true; // el audio sale del estudio; muted evita bloqueos de autoplay
      mediaProjectorVideo.classList.remove('hidden');
      lyricsWrapper.classList.add('hidden');

      let target = null;
      if (typeof st.time === 'number') {
        const elapsed = (st.action === 'play' && ts) ? Math.min(5, Math.max(0, (Date.now() - ts) / 1000)) : 0;
        target = st.time + elapsed;
      }
      const syncTime = () => {
        if (target === null) return;
        const tol = 0.15;
        if (Math.abs(mediaProjectorVideo.currentTime - target) > tol) {
          mediaProjectorVideo.currentTime = target;
        }
      };
      if (mediaProjectorVideo.readyState >= 1) syncTime();
      else mediaProjectorVideo.addEventListener('loadedmetadata', syncTime, { once: true });

      if (st.action === 'pause') {
        desiredVideoPlaying = false;
        mediaProjectorVideo.pause();
      } else if (st.action === 'play') {
        desiredVideoPlaying = true;
        if (mediaProjectorVideo.ended || (mediaProjectorVideo.duration > 0 && mediaProjectorVideo.currentTime >= (mediaProjectorVideo.duration - 0.3))) {
          mediaProjectorVideo.currentTime = 0;
        }
        const playSafe = () => {
          if (!desiredVideoPlaying) return;
          mediaProjectorVideo.muted = true;
          const p = mediaProjectorVideo.play();
          if (p && typeof p.catch === 'function') {
            p.catch((err) => {
              console.warn('[Projector Video Autoplay]', err);
            });
          }
        };
        if (mediaProjectorVideo.readyState >= 2) {
          playSafe();
        } else {
          mediaProjectorVideo.addEventListener('canplay', playSafe, { once: true });
          playSafe();
        }
      }
    }

    function updateDisplay(data) {
      if (!data) return;

      // Full-screen video projection handler (supports direct files and YouTube)
      if (!data.isClear && data.isVideo && data.videoUrl) {
        applyVideoState({
          url: data.videoUrl,
          action: data.videoAction === 'pause' ? 'pause' : 'play',
          time: data.currentTime,
          ts: data.timestamp,
          loop: Boolean(data.videoLoop)
        });
        return;
      } else {
        if (desiredVideoPlaying && data.timestamp && data.timestamp < lastVideoMsgTs) return;
        if (data.timestamp) lastVideoMsgTs = data.timestamp;
        desiredVideoPlaying = false;
        if (mediaProjectorVideo) {
          mediaProjectorVideo.pause();
          mediaProjectorVideo.classList.add('hidden');
        }
        if (youtubeProjectorLayer && youtubeProjectorIframe) {
          youtubeProjectorLayer.classList.add('hidden');
          youtubeProjectorIframe.src = '';
          youtubeProjectorIframe.removeAttribute('data-active-yt');
        }
        lyricsWrapper.classList.remove('hidden');
      }

      mainText.style.opacity = '0';
      subText.style.opacity = '0';

      setTimeout(() => {
        if (data.isClear) {
          mainText.textContent = '';
          subText.textContent = '';
          refBadge.classList.add('hidden');
        } else {
          const txt = data.text || '';
          mainText.textContent = txt;
          subText.textContent = data.subText || '';

          // Responsive dynamic font sizing
          if (currentLayoutMode === 'lowerThird') {
            mainText.className = 'slide-text-broadcast text-white font-black text-2xl md:text-3xl lg:text-4xl leading-tight tracking-wide fade-transition';
          } else {
            if (txt.length > 120) {
              mainText.className = 'slide-text-broadcast text-white font-black text-3xl md:text-4xl lg:text-5xl leading-snug tracking-wide fade-transition';
            } else if (txt.length > 60) {
              mainText.className = 'slide-text-broadcast text-white font-black text-4xl md:text-5xl lg:text-6xl leading-tight tracking-wide fade-transition';
            } else {
              mainText.className = 'slide-text-broadcast text-white font-black text-5xl md:text-7xl leading-tight tracking-wide fade-transition';
            }
          }

          if (data.badge) {
            refBadge.textContent = data.badge;
            refBadge.className = data.isVideo
              ? 'mb-4 px-6 py-1.5 rounded-full bg-red-600/30 border border-red-400 text-red-200 font-extrabold text-xl tracking-widest uppercase shadow-lg animate-pulse'
              : 'mb-4 px-6 py-1.5 rounded-full bg-amber-500/25 border border-amber-400/50 text-amber-300 font-extrabold text-xl tracking-widest uppercase shadow-lg';
            refBadge.classList.remove('hidden');
          } else {
            refBadge.classList.add('hidden');
          }
        }

        // Layout Mode
        if (data.layoutMode) {
          applyLayoutMode(data.layoutMode);
        }

        // Typography & Styles
        applyTypography(data);

        // Theme Palette
        if (data.theme && themesPalette[data.theme]) {
          activeTheme = data.theme;
        }

        // Campus Identifier
        if (data.campusName) {
          campusIndicator.textContent = data.campusName.toUpperCase() + ' - HDMI 1080p';
        }

        mainText.style.opacity = '1';
        subText.style.opacity = '1';
      }, 100);
    }

    function handleVideoControl(cmd) {
      if (!cmd) return;
      const ts = cmd.ts || Date.now();
      if (cmd.action === 'play') {
        applyVideoState({ url: cmd.videoUrl, action: 'play', time: cmd.time, ts });
      } else if (cmd.action === 'pause') {
        applyVideoState({ action: 'pause', time: cmd.time, ts });
      } else if (cmd.action === 'restart') {
        applyVideoState({ action: 'play', time: 0, ts });
      } else if (cmd.action === 'seek' && typeof cmd.time === 'number') {
        if (mediaProjectorVideo && ts >= lastVideoMsgTs) mediaProjectorVideo.currentTime = cmd.time;
      } else if (cmd.action === 'mute') {
        // El proyector siempre va en silencio: el audio sale del estudio / consola
      } else if (cmd.action === 'loop') {
        if (mediaProjectorVideo) mediaProjectorVideo.loop = Boolean(cmd.loop);
      } else if (cmd.action === 'stop') {
        applyVideoState({ action: 'stop', ts });
      }
    }

    // =========================================================================
    // 📺 CAPA 1 OVERLAY: PORTADA / SLATE & LOGO BUG
    // =========================================================================
    const projectorSlateLayer = document.getElementById('projectorSlateLayer');
    const projectorSlateImg = document.getElementById('projectorSlateImg');
    const projectorSlateTextContainer = document.getElementById('projectorSlateTextContainer');
    const projectorSlateTitle = document.getElementById('projectorSlateTitle');
    const projectorSlateSubtitle = document.getElementById('projectorSlateSubtitle');
    const projectorLogoLayer = document.getElementById('projectorLogoLayer');
    const projectorLogoBox = document.getElementById('projectorLogoBox');
    const projectorLogoImg = document.getElementById('projectorLogoImg');

    function updateProjectorLayer1(data) {
      if (!data) return;
      const isEnabled = Boolean(data.enabled);
      const itemType = data.itemType || 'logo';

      // 1. Portada / Telón de Espera
      if (isEnabled && itemType === 'slate') {
        if (projectorSlateLayer) {
          projectorSlateLayer.classList.remove('hidden');
          // Smooth fade in
          requestAnimationFrame(() => {
            projectorSlateLayer.classList.remove('opacity-0');
            projectorSlateLayer.classList.add('opacity-100');
          });

          if (projectorSlateImg) {
            if (data.slateImageUrl) {
              projectorSlateImg.src = data.slateImageUrl;
              projectorSlateImg.classList.remove('hidden');
            } else {
              projectorSlateImg.src = '';
              projectorSlateImg.classList.add('hidden');
            }
          }

          const showText = data.slateShowText === true;
          if (projectorSlateTextContainer) {
            if (showText && (data.slateTitle || data.slateSubtitle)) {
              projectorSlateTextContainer.classList.remove('hidden');
              if (projectorSlateTitle) {
                projectorSlateTitle.textContent = data.slateTitle || '';
                projectorSlateTitle.classList.toggle('hidden', !data.slateTitle);
              }
              if (projectorSlateSubtitle) {
                projectorSlateSubtitle.textContent = data.slateSubtitle || '';
                projectorSlateSubtitle.classList.toggle('hidden', !data.slateSubtitle);
              }
            } else {
              projectorSlateTextContainer.classList.add('hidden');
            }
          }
        }
      } else {
        if (projectorSlateLayer) {
          projectorSlateLayer.classList.remove('opacity-100');
          projectorSlateLayer.classList.add('opacity-0');
          setTimeout(() => {
            if (projectorSlateLayer && projectorSlateLayer.classList.contains('opacity-0')) {
              projectorSlateLayer.classList.add('hidden');
            }
          }, 500);
        }
      }

      // 2. Logo Bug / Marca de Agua
      if (isEnabled && itemType === 'logo' && data.logoImageUrl) {
        if (projectorLogoLayer && projectorLogoBox && projectorLogoImg) {
          projectorLogoLayer.classList.remove('hidden');
          projectorLogoImg.src = data.logoImageUrl;

          const corner = data.logoCorner || 'top-right';
          const scale = (data.logoScale || 100) / 100;
          const opacity = Math.max(0.05, Math.min(1.0, (data.logoOpacity || 85) / 100));

          projectorLogoImg.style.opacity = opacity;
          projectorLogoImg.style.transform = `scale(${scale})`;
          projectorLogoImg.style.transformOrigin = corner.replace('-', ' ');

          // Position according to corner
          projectorLogoBox.className = 'absolute transition-all duration-300';
          if (corner === 'top-left') {
            projectorLogoBox.style.top = '40px';
            projectorLogoBox.style.left = '50px';
            projectorLogoBox.style.bottom = 'auto';
            projectorLogoBox.style.right = 'auto';
          } else if (corner === 'bottom-left') {
            projectorLogoBox.style.bottom = '40px';
            projectorLogoBox.style.left = '50px';
            projectorLogoBox.style.top = 'auto';
            projectorLogoBox.style.right = 'auto';
          } else if (corner === 'bottom-right') {
            projectorLogoBox.style.bottom = '40px';
            projectorLogoBox.style.right = '50px';
            projectorLogoBox.style.top = 'auto';
            projectorLogoBox.style.left = 'auto';
          } else {
            // top-right
            projectorLogoBox.style.top = '40px';
            projectorLogoBox.style.right = '50px';
            projectorLogoBox.style.bottom = 'auto';
            projectorLogoBox.style.left = 'auto';
          }
        }
      } else {
        if (projectorLogoLayer) {
          projectorLogoLayer.classList.add('hidden');
          if (projectorLogoImg) projectorLogoImg.src = '';
        }
      }
    }

    channel.onmessage = (event) => {
      if (event.data && event.data.type === 'SLIDE_UPDATE') {
        updateDisplay(event.data.payload);
      } else if (event.data && event.data.type === 'VIDEO_CONTROL') {
        handleVideoControl(event.data.payload);
      } else if (event.data && event.data.type === 'LAYER1_UPDATE') {
        updateProjectorLayer1(event.data);
      } else if (event.data && event.data.type === 'VIDEO_SYNC_PULSE') {
        if (!mediaProjectorVideo || mediaProjectorVideo.readyState < 1) return;
        const elapsed = (Date.now() - (event.data.ts || Date.now())) / 1000;
        const target = (event.data.time || 0) + elapsed;
        if (Math.abs(mediaProjectorVideo.currentTime - target) > 0.15) {
          mediaProjectorVideo.currentTime = target;
        }
        if (mediaProjectorVideo.paused) {
          mediaProjectorVideo.play().catch(() => {});
        }
      }
    };

    window.addEventListener('storage', (e) => {
      if (e.key === 'omnicast_current_slide') {
        try {
          updateDisplay(JSON.parse(e.newValue));
        } catch(err) {}
      } else if (e.key === 'omnicast_video_control') {
        try {
          handleVideoControl(JSON.parse(e.newValue));
        } catch(err) {}
      } else if (e.key === 'omnicast_layer1_state') {
        try {
          updateProjectorLayer1(JSON.parse(e.newValue));
        } catch(err) {}
      }
    });

    function prewarmProjectorVideo(items) {
      if (!mediaProjectorVideo || mediaProjectorVideo.getAttribute('data-src')) return;
      if (!Array.isArray(items) || !items.length) return;
      let svcIds = [];
      try { svcIds = JSON.parse(localStorage.getItem('omnicast_service_items') || '[]'); } catch (e) {}
      const candidates = items.filter(it => it && it.videoUrl && it.videoUrl.startsWith('/uploads/'));
      const chosen = candidates.find(it => svcIds.includes(it.id)) || candidates[0];
      if (chosen && chosen.videoUrl) {
        const sep = chosen.videoUrl.includes('?') ? '&' : '?';
        mediaProjectorVideo.src = `${chosen.videoUrl}${sep}screen=projector`;
        mediaProjectorVideo.setAttribute('data-src', chosen.videoUrl);
        mediaProjectorVideo.muted = true;
        try { mediaProjectorVideo.load(); } catch (e) {}
      }
    }

    try {
      const rawDb = localStorage.getItem('omnicast_library_db');
      if (rawDb) {
        const parsedDb = JSON.parse(rawDb);
        if (parsedDb && Array.isArray(parsedDb.libraryItems)) {
          prewarmProjectorVideo(parsedDb.libraryItems);
        }
      }
    } catch (e) {}

    const stored = localStorage.getItem('omnicast_current_slide');
    if (stored) {
      try {
        updateDisplay(JSON.parse(stored));
      } catch(err) {}
    }

    try {
      const storedL1 = localStorage.getItem('omnicast_layer1_state');
      if (storedL1) {
        updateProjectorLayer1(JSON.parse(storedL1));
      }
    } catch (e) {}

    // Connect to Server-Sent Events after window load to prevent infinite browser tab spinner
    document.addEventListener('click', () => {
      if (desiredVideoPlaying && mediaProjectorVideo && mediaProjectorVideo.paused) {
        mediaProjectorVideo.muted = true;
        mediaProjectorVideo.play().catch(() => {});
      }
      if (videoLoopPlayer && !videoLoopPlayer.classList.contains('hidden') && videoLoopPlayer.paused) {
        videoLoopPlayer.muted = true;
        videoLoopPlayer.play().catch(() => {});
      }
    });

    window.addEventListener('load', () => {
      setTimeout(() => {
        const sseUrl = activeChurch ? `/api/events?church=${encodeURIComponent(activeChurch)}` : '/api/events';
        const evtSource = new EventSource(sseUrl);
        evtSource.addEventListener('video_control', (e) => {
          try {
            handleVideoControl(JSON.parse(e.data));
          } catch (err) {}
        });
        evtSource.addEventListener('slide_payload', (e) => {
          try {
            updateDisplay(JSON.parse(e.data));
          } catch (err) {}
        });
        evtSource.addEventListener('layer1_update', (e) => {
          try {
            updateProjectorLayer1(JSON.parse(e.data));
          } catch (err) {}
        });
        evtSource.addEventListener('state', (e) => {
          try {
            const state = JSON.parse(e.data);
            if (state.layer1) {
              updateProjectorLayer1(state.layer1);
            }
            if (Array.isArray(state.libraryItems)) {
              prewarmProjectorVideo(state.libraryItems);
            }
            if (state.currentSlidePayload) {
              updateDisplay(state.currentSlidePayload);
              return;
            }
            if (state.libraryItems && state.libraryItems[state.itemIndex]) {
              const item = state.libraryItems[state.itemIndex];
              const slide = item.slides && item.slides[state.slideIndex];
              const isVideo = item.category === 'medios' || Boolean(item.isVideo) || Boolean(item.videoUrl);
              updateDisplay({
                text: state.isBlackout ? '' : (slide ? slide.text : ''),
                subText: state.isBlackout ? '' : (slide ? slide.subText : ''),
                isClear: state.isBlackout,
                badge: slide ? slide.badge : '',
                isVideo: isVideo,
                videoUrl: item.videoUrl || '',
                videoAction: state.isBlackout ? 'pause' : 'play',
                theme: state.theme
              });
            }
          } catch (err) {}
        });
      }, 600);
    });

    // =========================================================================
    // 📺 PURE FULLSCREEN KIOSK ENGINE (Double-Click or 'F' Key)
    // =========================================================================
    function toggleProjectorFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    }
    document.addEventListener('dblclick', (e) => {
      if (['INPUT', 'BUTTON', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
      toggleProjectorFullscreen();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (!['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          toggleProjectorFullscreen();
        }
      }
    });

    // Service Worker for instant offline readiness
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
